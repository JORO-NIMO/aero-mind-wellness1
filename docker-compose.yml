version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: aeromind_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aeromind_pass}
      POSTGRES_DB: ${DB_NAME:-aeromind_wellness}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aeromind_api
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-aeromind_pass}@db:5432/${DB_NAME:-aeromind_wellness}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3000
    depends_on:
      - db

volumes:
  pgdata:
